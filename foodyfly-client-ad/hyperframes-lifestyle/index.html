<!doctype html>
<html lang="fr" data-resolution="landscape-4k">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=3840, height=2160" />
<script src="assets/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:3840px;height:2160px;overflow:hidden;background:#032e23}
#root{position:relative;width:100%;height:100%;overflow:hidden}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="3840" data-height="2160">
  <div id="shot-market" data-composition-id="market" data-composition-src="compositions/market.html" data-start="0" data-duration="5" data-track-index="0"></div>
  <div id="shot-hands" data-composition-id="hands" data-composition-src="compositions/hands.html" data-start="5" data-duration="3" data-track-index="1"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
