<html lang="fr">
<body>

<div id="market-root" data-composition-id="market" data-start="0" data-duration="5" data-width="3840" data-height="2160">
  <div id="m-scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
    <div id="m-photo"></div>
    <div id="m-shade"></div>
    <div id="m-vignette"></div>
    <div id="m-copy"><span class="line"><span id="m-l1">Et si tout devenait</span></span><span class="line lime"><span id="m-l2">plus simple ?</span></span></div>
  </div>
<style>
@font-face{font-family:Manrope;src:url(assets/fonts/manrope-latin-800-normal.woff2);font-weight:800}
#market-root{--ground:#032e23;--ink:#ffffff;--lime:#b7ef4a}
*{margin:0;padding:0;box-sizing:border-box}

#market-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:Manrope,sans-serif}
.clip{position:absolute;inset:0}
#m-photo{position:absolute;inset:0;background:url(assets/market.jpg) center/cover no-repeat;transform-origin:64% 88%}
#m-shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,46,35,.82) 0%,rgba(3,46,35,.35) 34%,rgba(3,46,35,0) 58%)}
#m-vignette{position:absolute;inset:0;box-shadow:inset 0 0 520px rgba(2,24,18,.55)}
#m-copy{position:absolute;left:250px;bottom:250px;color:var(--ink);font-weight:800;font-size:178px;line-height:1.02;letter-spacing:-.045em}
.line{display:block;overflow:hidden;padding:0 .04em .06em}
.line span{display:inline-block}
.line.lime span{color:var(--lime)}
</style>
<script>
(() => {
const tl = gsap.timeline({ paused: true });
// rack focus in, slow push toward the phone in her hands, then a fast push that hands over to the 3D phone
tl.fromTo('#m-photo', { scale: 1.1, filter: 'blur(26px) brightness(.8)' }, { scale: 1.16, filter: 'blur(0px) brightness(1)', duration: 1.1, ease: 'power3.out' }, 0);
tl.to('#m-photo', { scale: 1.28, duration: 2.6, ease: 'none' }, 1.1);
tl.to('#m-photo', { scale: 3.1, filter: 'blur(40px) brightness(.55)', duration: 1.3, ease: 'power3.in' }, 3.7);
tl.fromTo('#m-shade', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.2);
tl.to('#m-shade', { opacity: 0.4, duration: 1.0, ease: 'power2.in' }, 3.7);
tl.fromTo('#m-l1', { yPercent: 110, filter: 'blur(14px)' }, { yPercent: 0, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out' }, 0.55);
tl.fromTo('#m-l2', { yPercent: 110, filter: 'blur(14px)' }, { yPercent: 0, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out' }, 1.05);
tl.to('#m-copy', { y: -40, duration: 3.0, ease: 'none' }, 0.6);
tl.to('#m-l1', { yPercent: -112, filter: 'blur(16px)', duration: 0.55, ease: 'power3.in' }, 3.45);
tl.to('#m-l2', { yPercent: -112, filter: 'blur(16px)', duration: 0.55, ease: 'power3.in' }, 3.55);
window.__timelines = window.__timelines || {};
window.__timelines['market'] = tl;
tl.seek(0);
})();
</script>
</div>
</body>
</html>
