<html lang="fr">
<body>

<div id="hands-root" data-composition-id="hands" data-start="0" data-duration="3" data-width="3840" data-height="2160">
  <div id="h-scene" class="clip" data-start="0" data-duration="3" data-track-index="0">
    <div id="h-photo"></div>
    <div id="h-shade"></div>
    <div id="h-vignette"></div>
    <div id="h-copy"><span class="line"><span id="h-l1">Un clic.</span></span><span class="line lime"><span id="h-l2">Mille envies.</span></span></div>
  </div>
<style>
@font-face{font-family:Manrope;src:url(assets/fonts/manrope-latin-800-normal.woff2);font-weight:800}
#hands-root{--ground:#032e23;--ink:#ffffff;--lime:#b7ef4a}
*{margin:0;padding:0;box-sizing:border-box}

#hands-root{position:relative;width:100%;height:100%;overflow:hidden;font-family:Manrope,sans-serif}
.clip{position:absolute;inset:0}
#h-photo{position:absolute;inset:0;background:url(assets/hands.jpg) center/cover no-repeat;transform-origin:70% 40%}
#h-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,46,35,.78) 0%,rgba(3,46,35,.35) 45%,rgba(3,46,35,0) 70%)}
#h-vignette{position:absolute;inset:0;box-shadow:inset 0 0 520px rgba(2,24,18,.6)}
#h-copy{position:absolute;left:260px;bottom:330px;color:var(--ink);font-weight:800;font-size:230px;line-height:1.0;letter-spacing:-.045em}
.line{display:block;overflow:hidden;padding:0 .04em .06em}
.line span{display:inline-block}
.line.lime span{color:var(--lime)}
</style>
<script>
(() => {
const tl = gsap.timeline({ paused: true });
tl.fromTo('#h-photo', { scale: 1.16, x: 120, filter: 'blur(22px)' }, { scale: 1.06, x: 0, filter: 'blur(0px)', duration: 1.0, ease: 'power3.out' }, 0);
tl.to('#h-photo', { scale: 1.0, x: -60, duration: 2.0, ease: 'none' }, 1.0);
tl.fromTo('#h-shade', { opacity: 0.4 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0);
tl.fromTo('#h-l1', { yPercent: 110, filter: 'blur(14px)' }, { yPercent: 0, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out' }, 0.3);
tl.fromTo('#h-l2', { yPercent: 110, filter: 'blur(14px)' }, { yPercent: 0, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out' }, 0.75);
tl.to('#h-copy', { x: 30, duration: 2.4, ease: 'none' }, 0.3);
window.__timelines = window.__timelines || {};
window.__timelines['hands'] = tl;
tl.seek(0);
})();
</script>
</div>
</body>
</html>
